// Confetti when "Waiting on you" empties. Colours from the theme; skipped under reduced motion.
let lastYou = null;
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.className = 'confetti'; cv.width = W * dpr; cv.height = H * dpr;
  document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--ok', '--warn', '--agent', '--brand', '--mark', '--bad'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  const from = $('#nav').getBoundingClientRect();
  const ps = Array.from({ length: 150 }, () => ({ x: from.left + from.width / 2, y: from.top + 40, vx: (Math.random() - .5) * 12, vy: -Math.random() * 10 - 3,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 5 + Math.random() * 5, h: 3 + Math.random() * 3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
    }
    if (t - t0 < 3500) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}


// Konami code (up up down down left right left right B A, outside a text field) switches to the hidden arcade theme and back.
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiAt = 0;
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) { konamiAt = 0; return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiAt = k === KONAMI[konamiAt] ? konamiAt + 1 : k === KONAMI[0] ? 1 : 0;
  if (konamiAt < KONAMI.length) return;
  konamiAt = 0;
  if (document.documentElement.dataset.theme === 'konami') { setTheme(store.get('pq.theme.before') || DEFAULT_THEME); toast('Game over. Back to work.'); return; }
  if (store.get('pq.konami') !== 'found') { store.set('pq.konami', 'found'); THEMES.push(['konami', 'Arcade', 'Found']); fillThemes(); }
  store.set('pq.theme.before', document.documentElement.dataset.theme);
  setTheme('konami');
  toast('★ 1UP · Arcade theme unlocked');
  confetti();
});

// ---- markdown, just what the cards use ----------------------------------------

// A local path with an optional #L42 becomes a preview link; it also carries the VS Code URL for Ctrl+click.
function local(raw) {
  if (!/^[A-Za-z]:[\\/]/.test(raw)) return null;
  const [p, frag] = raw.split('#');
  const line = frag && /^L(\d+)/.exec(frag);
  const norm = p.replace(/\\/g, '/');
  return { path: norm, line: line ? Number(line[1]) : 0, vscode: 'vscode://file/' + norm.replace(/ /g, '%20') + (line ? ':' + line[1] : '') };
}
function link(text, url) {
  const l = local(url);
  if (l) return `<a class="code" href="${esc(l.vscode)}" data-path="${esc(l.path)}" data-line="${l.line}" title="Click to preview, Ctrl+click opens VS Code">${text}</a>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`;
}

function inline(s) {
  return s.split(/(`[^`]*`)/).map(part => {
    if (/^`[^`]*`$/.test(part)) return `<code>${esc(part.slice(1, -1))}</code>`;
    const re = /\[([^\]]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<>)]+)|([A-Za-z]:\\[^\n<>"`*]*?\.(?:md|al|diff|ps1|json|txt|xlf|xlsx))(?![\w])|\*\*([^*]+)\*\*/g;
    let out = '', last = 0, m;
    while ((m = re.exec(part))) {
      out += esc(part.slice(last, m.index));
      if (m[1]) out += link(esc(m[1]), m[2]);
      else if (m[3]) out += link(esc(m[3]), m[3]);
      else if (m[4]) out += link(esc(m[4].split('\\').pop()), m[4]);
      else out += `<b>${esc(m[5])}</b>`;
      last = re.lastIndex;
    }
    return out + esc(part.slice(last));
  }).join('');
}

function md(text) {
  const out = []; let para = [];
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`); para = []; };
  let fence = null;
  for (const line of text.split(/\r?\n/)) {
    let m;
    if (/^\s*```/.test(line)) { if (fence) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null; } else { flush(); fence = []; } continue; }
    if (fence) { fence.push(line); continue; }
    if (!line.trim()) { flush(); continue; }
    if ((m = /^#{1,6}\s+(.*)$/.exec(line))) { flush(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if (/^\|/.test(line)) { flush(); if (!/^\|[\s:|-]+\|$/.test(line)) out.push(`<div class="li"><span class="mk">·</span><span>${inline(line.replace(/^\||\|$/g, '').split('|').map(c => c.trim()).join(' · '))}</span></div>`); continue; }
    if ((m = /^(\s*)(-|\*|\d+\.)\s+(.*)$/.exec(line))) {
      flush();
      const mark = /^\d/.test(m[2]) ? m[2] : '•';
      out.push(`<div class="li" style="margin-left:${Math.floor(m[1].length / 2) * 12}px"><span class="mk">${esc(mark)}</span><span>${inline(m[3])}</span></div>`);
      continue;
    }
    if (/^\s/.test(line) && out.length && out[out.length - 1].startsWith('<div class="li"') && !para.length) {
      out[out.length - 1] = out[out.length - 1].replace(/<\/span><\/div>$/, ' ' + inline(line.trim()) + '</span></div>');
      continue;
    }
    para.push(line.trim());
  }
  flush();
  return `<div class="md">${out.join('')}</div>`;
}
const plain = s => s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[`*]/g, '');

// ---- AL highlighting, good enough for reading ---------------------------------

const KW = new Set(('begin end if then else exit var procedure local internal trigger repeat until while do for to downto case of with not and or xor div mod ' +
  'true false record codeunit page table report query enum interface field fields key keys label temporary protected ' +
  'text code integer decimal boolean date datetime time option guid dictionary list biginteger blob dateformula duration recordref fieldref ' +
  'tableextension pageextension enumextension extends layout actions area group part action dataitem column requestpage value obsolete').split(' '));
function hl(line) {
  const re = /(\/\/.*$)|('(?:[^']|'')*')|("[^"]*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(\s*\()?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    if (m[1]) out += `<span class="tk-cm">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-id">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="tk-num">${esc(m[4])}</span>`;
    else if (KW.has(m[5].toLowerCase())) out += `<span class="tk-kw">${esc(m[5])}</span>` + esc(m[6] || '');
    else if (m[6]) out += `<span class="tk-fn">${esc(m[5])}</span>` + esc(m[6]);
    else out += esc(m[5]);
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}

// ---- data -------------------------------------------------------------------

async function api(url, opts) {
  let r;
  try { r = await fetch(url, opts); }
  catch { throw new Error('No answer from the queue server. Start it with app\\restart.cmd, then check the card before you record again.'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadBoard() {
  board = await api('/api/board');
  // A decision sent while a job ran waits on the server; its card still reads `you` until the job ends, so it moves
  // out of "Waiting on you" here and the next card comes first.
  const q = new Map(board.queued.map(e => [e.id, e.at]));
  board.queuedCards = board.you.filter(c => q.has(c.Id)).map(c => ({ ...c, QueuedAt: q.get(c.Id) }));
  board.you = board.you.filter(c => !q.has(c.Id));
  if (lastYou > 0 && !board.you.length) confetti(); // only when it empties while open, not on a load that finds it empty
  lastYou = board.you.length;
  renderNav();
  // The counts live on the sidebar's section headings; #stats only shows a load error.
  $('#stats').innerHTML = '';
}

const actChip = a => `<span class="chip act act-${esc(a)}">${esc(a)}</span>`;
// When work on a card started, from its first transcript. Long form on the card, short in the list.
function startedText(started, long) {
  if (!started) return 'not started';
  return long ? `started ${started}` : `since ${started.slice(5)}`;
}
function flags(c) {
  const f = [];
  if (c.BlocksAgent) f.push(`<span class="ct agent">${ICON.bot}unblocks agent</span>`);
  f.push(`<span class="ct">${PRIO[c.AdoPrio] || c.AdoPrio}</span>`);
  if (c.Bounces >= 2) f.push(`<span class="chip prod">bounced ${c.Bounces}x</span>`);
  return f.join('');
}

function renderNav() {
  const sel = id => (current === id ? ' sel' : '');
  // Each heading closes the box of the section before it and opens its own; the last box is closed after the loop.
  let h = '';
  const head = (t, n) => `${h ? '</section>' : ''}<section class="navsec"><div class="navh">${t}<span class="n">${n}</span></div>`;
  h += head('Waiting on you', board.you.length);
  if (!board.you.length) h += `<div class="flat zero">${ICON.trophy}Nothing. Good.</div>`;
  board.you.forEach((c, i) => {
    const more = c.Questions.length > 1 ? ` +${c.Questions.length - 1}` : '';
    h += `<a class="item${sel(c.Id)}" href="#${esc(c.Id)}" draggable="true" data-you="${esc(c.Id)}" title="Drag to reorder">
      <div class="top"><span class="rank">${i + 1}</span><span class="id">${esc(c.Id)}</span><span class="title">${esc(c.Title)}</span></div>
      <div class="sub">${esc(plain(c.Questions[0] || ''))}</div>
      <div class="chips">${actChip(c.Action)}<span class="ct">${esc(startedText(c.Started, false))}${more ? ' · ' + c.Questions.length + ' questions' : ''}</span>${flags(c)}</div></a>`;
  });
  const simple = (list, sub) => list.map(c => `<a class="item${sel(c.Id)}" href="#${esc(c.Id)}">
      <div class="top"><span class="id">${esc(c.Id)}</span><span class="title">${esc(c.Title)}</span></div>
      <div class="sub" style="margin-left:0">${sub(c)}</div></a>`).join('');
  if (board.queuedCards.length) h += head('Queued, recorded when the job ends', board.queuedCards.length) +
    simple(board.queuedCards, c => 'queued ' + esc(new Date(c.QueuedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })));
  if (board.decided.length) h += head('Decided',board.decided.length) + simple(board.decided, c => 'decided ' + esc(c.Updated));
  h += head('With the agent', board.agent.length) + simple(board.agent, c => 'next: ' + esc(c.NextStep));
  // The PR is a span, not a link: the sidebar item is already an <a>. The document handler for .prlink opens it.
  h += head('In review', board.review.length) + simple(board.review, c => (/^\d+$/.test(c.Pr)
    ? `<span class="prlink" role="link" tabindex="0" data-pr="${esc(c.Pr)}" title="Open PR ${esc(c.Pr)} in Azure DevOps">PR ${esc(c.Pr)}</span>` : 'PR ' + esc(c.Pr)) +
    (c.Reviewer && c.Reviewer !== 'none' ? ' · ' + esc(c.Reviewer) : '') + ' · since ' + esc(c.Updated));
  h += head('Parked', board.parked.length) + simple(board.parked, c => 'revisit ' + esc(c.Revisit));
  // Repo copies are off in config.json unless repoCopies.enabled; then the list is empty and the section goes.
  if (board.copies.length) h += head('Repo copies', board.copies.length);
  board.copies.forEach(r => {
    h += `<div class="copy"><span><button class="nm vsc" data-repo="${esc(r.Name)}" title="Open in VS Code">${planetIcon(r.Name)}${esc(r.Name.replace('BC25_', ''))}</button>` +
      (r.Git ? `<span class="br mono" title="${esc(r.Branch)}">${esc(r.Branch)}</span>` : '<span class="br">not a git repo</span>') + '</span>' +
      `<span style="text-align:right">${r.Git ? (r.Card ? `<a class="cardlink" href="#${esc(r.Card)}" title="Open card ${esc(r.Card)}">${esc(r.Card)}</a>`
        : r.Free ? '<span class="chip" style="color:var(--ok)">free</span>'
        : `<span class="chip" title="${esc(r.Dirty ? 'Has uncommitted changes' : 'Not on ' + r.Base + ', so a new card won\x27t take it')}">idle</span>`) : ''}` +
      `${r.Git && r.Dirty ? '<br><span style="font-size:11.5px">' + r.Dirty + ' dirty</span>' : ''}</span></div>`;
  });
  if (board.warnings.length) {
    h += head('Warnings', board.warnings.length);
    board.warnings.forEach(w => { h += `<div class="warnline">${esc(w)}</div>`; });
  }
  $('#nav').innerHTML = h + '</section>';
}

// Waiting on you is dragged into the owner's own order, saved in order.json (server setOrder). It overrules the flags.
let dragId = null;
const clearDrop = () => $('#nav').querySelectorAll('.drop-before, .drop-after, .dragsrc').forEach(x => x.classList.remove('drop-before', 'drop-after', 'dragsrc'));
$('#nav').addEventListener('dragstart', e => {
  const it = e.target.closest && e.target.closest('.item[data-you]');
  if (!it) return;
  dragId = it.dataset.you;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
  it.classList.add('dragsrc');
});
$('#nav').addEventListener('dragover', e => {
  const it = dragId && e.target.closest('.item[data-you]');
  if (!it) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = it.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  $('#nav').querySelectorAll('.drop-before, .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  if (it.dataset.you !== dragId) it.classList.add(after ? 'drop-after' : 'drop-before');
});
$('#nav').addEventListener('dragend', () => { dragId = null; clearDrop(); });
$('#nav').addEventListener('drop', async e => {
  const it = dragId && e.target.closest('.item[data-you]');
  if (!it) return;
  e.preventDefault();
  const moved = dragId, target = it.dataset.you, after = it.classList.contains('drop-after');
  dragId = null; clearDrop();
  if (target === moved) return;
  const card = board.you.find(c => c.Id === moved);
  const list = board.you.filter(c => c.Id !== moved);
  list.splice(list.findIndex(c => c.Id === target) + (after ? 1 : 0), 0, card);
  if (list.every((c, k) => c.Id === board.you[k].Id)) return;
  board.you = list;
  renderNav();
  try {
    const r = await post('/api/order', { ids: list.map(c => c.Id), moved });
    if (r.pushError) { notice = { bad: true, msg: `Order saved. Push failed: ${r.pushError}` }; openCard(current); }
  } catch (err) { notice = { bad: true, msg: err.message }; await loadBoard(); openCard(current); }
});

// ---- card -------------------------------------------------------------------

async function openCard(id) {
  if (id === 'faq') return openFaq();
  // Coming back from the FAQ to the card it was opened from keeps the pasted screenshots.
  if (current !== id && !(current === 'faq' && id === faqFrom)) { pending.forEach(p => URL.revokeObjectURL(p.url)); pending = []; }
  current = id; form = null;
  if (board) renderNav();
  if (!id) { $('#content').innerHTML = `<div class="empty">${ART.cat}Pick a card.</div>`; return; }
  let c;
  try { c = await api('/api/card/' + encodeURIComponent(id)); }
  catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (current !== id) return;
  const fm = c.fm, sec = t => c.sections.find(s => s.title === t);
  const queued = !!board && board.queuedCards.some(x => x.Id === id);
  // A card with no questions (back from parked, say) still takes a note: the cycle reads it as instructions (2026-11-20).
  const canRule = fm.state === 'you' && !queued;
  form = canRule ? { id, qs: c.questions, answers: Object.fromEntries(c.questions.map(q => [q.n, { choice: '', note: '' }])), note: '' } : null;

  // Info only, no borders: what can be clicked lives in the links row and the toolbar below.
  const meta = [
    fm.state === 'you' ? actChip(fm.action) : '',
    fm.blocks_agent === 'yes' ? `<span class="mi agent">${ICON.bot}unblocks agent</span>` : '',
    `<span class="mi">${esc(fm.ado_state)} · ${PRIO[fm.ado_prio] || esc(fm.ado_prio)}</span>`,
    fm.repo !== 'none' ? `<span class="mi"${fm.branch !== 'none' ? ` title="${esc(fm.branch)}"` : ''}>${planetIcon(fm.repo) || ICON.repo}${esc(fm.repo)}</span>` : '',
    `<span class="mi" id="started">${ICON.clock}…</span>`,
  ].filter(Boolean).join('');
  const links = /^\d+$/.test(fm.pr) ? `<a href="${ADO}/_git/Stacc.Core/pullrequest/${esc(fm.pr)}" target="_blank" rel="noopener">${ICON.ext}PR ${esc(fm.pr)}</a>` : '';
  const bigid = /^\d+$/.test(fm.id)
    ? `<a class="bigid" href="${ADO}/_workitems/edit/${esc(fm.id)}" target="_blank" rel="noopener" title="Open the work item in ADO">${esc(fm.id)}</a>`
    : `<span class="bigid">${esc(fm.id)}</span>`;

  let h = '';
  if (notice) {
    const log = notice.log ? `<details><summary>Output</summary><div class="pulllog mono">${esc(notice.log)}</div></details>` : '';
    h += `<div class="notice${notice.bad ? ' bad' : ''}">${ICON.ok}<div>${esc(notice.msg)}${log}</div></div>`; notice = null;
  }
  h += `<div class="card"><div class="chead"><div class="hero">${bigid}<h2>${esc(fm.title)}</h2></div><div class="meta">${meta}</div>${links ? `<div class="links">${links}</div>` : ''}`;
  h += cardActions(fm, c.reopen) + '</div>';
  const edits = board ? (board.queuedEdits || []).filter(e => e.id === id) : [];
  if (edits.length) h += `<div class="readonly">Queued for when the running job ends: ${edits.map(e => esc(e.what)).join(', ')}. The card below doesn't show ${edits.length === 1 ? 'it' : 'them'} yet.</div>`;
  if (fm.state === 'agent') h += `<div class="readonly">With the agent. Next step: ${esc(fm.next_step)}</div>`;
  if (sec('Now')) h += `<div class="sec">Now</div><div class="panel now">${md(sec('Now').body)}</div>`;

  const waiting = sec('Waiting on you');
  if (waiting) {
    h += '<div class="sec">Waiting on you</div>';
    if (!canRule) {
      if (queued) h += '<div class="readonly">Your decision is <b>queued</b>. It is recorded and committed when the running job ends.</div>';
      else if (fm.state !== 'you') h += `<div class="readonly">This card is <b>${esc(fm.state)}</b>, so it takes no decisions here.</div>`;
      h += `<div class="panel">${md(waiting.body)}</div>`;
    } else {
      for (const q of c.questions) {
        const fid = /^([BSNC]\d+)\.\s+(.*)$/.exec(q.text);
        const text = fid ? `<span class="find ${fid[1][0]}">${esc(fid[1])}</span>${inline(fid[2])}` : inline(q.text);
        h += `<div class="q" data-n="${q.n}"><div class="qhead"><span class="qnum">${q.n}</span><div class="md">${text}</div></div><div class="opts">`;
        for (const o of q.options) h += `<button class="opt" data-n="${q.n}" data-k="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span class="t md">${inline(o.text)}</span>${ICON.check}</button>`;
        h += `</div><div class="notefield"><textarea rows="1" data-n="${q.n}" placeholder="${q.options.length ? 'Note, or your own answer instead of a letter' : 'Your answer'}"></textarea></div></div>`;
      }
      const rest = waiting.body.split('\n').filter(l => l.trim() && !/^\s/.test(l) && !/^\d+\.\s/.test(l)).join('\n');
      if (rest) h += `<div class="after">${md(rest)}</div>`;
      const noQs = !c.questions.length;
      h += `<div class="sec">${noQs ? 'Instructions for the cycle' : 'Note for the whole card'}</div><textarea id="cardnote" rows="${noQs ? 4 : 2}" placeholder="${noQs ? 'What the cycle should do with this card' : 'Optional'}"></textarea>${shotsSection(c)}
        <div class="bar">${noQs ? '' : `<div class="segs">${c.questions.map(q => `<span class="seg" data-n="${q.n}"></span>`).join('')}</div>`}
        <span class="status" id="status">${noQs ? 'Write instructions.' : 'Nothing picked yet.'} Ctrl+Enter records.</span>
        <button class="btn primary" id="submit" disabled>${noQs ? 'Record' : 'Record decisions'}</button></div>`;
    }
  }
  if (!form) h += shotsSection(c);
  tests = null;
  const tl = sec('Test list');
  if (tl && tl.body) h += testListSection(id, tl.body);
  // The wrap-up skill writes the PR's release note here as plain lines, ready to paste. Shown as written, not as markdown.
  const note = sec('Release note');
  if (note && note.body) h += `<div class="sec">Release note<button class="btn ghost secbtn" id="copynote">Copy</button></div><div class="panel"><div class="relnote">${esc(note.body)}</div></div>`;
  h += '<div class="sec">Time</div><div class="panel" id="timepanel"><span class="hint">Reading the transcripts…</span></div>';
  for (const s of c.sections) {
    if (['Now', 'Waiting on you', 'Test list', 'Release note', 'Decisions', 'Time'].includes(s.title) || !s.body) continue;
    h += `<div class="sec">${esc(s.title)}</div><div class="panel">${md(s.body)}</div>`;
  }
  const decisions = sec('Decisions');
  if (decisions && decisions.body && decisions.body !== 'Dated, append only.') h += `<div class="sec">Decisions</div><div class="panel"><details><summary>Earlier decisions</summary>${md(decisions.body)}</details></div>`;
  h += '</div>';
  $('#content').innerHTML = h;
  $('#content').scrollTop = 0;
  if (form) { wireForm(); restoreDraft(); } else store.del(draftKey(id));
  wireActions(fm);
  if (tests) wireTests();
  if (note && note.body) $('#copynote').onclick = async e => {
    const btn = e.currentTarget;
    let ok = true;
    try { await navigator.clipboard.writeText(note.body); } catch { ok = false; }
    btn.textContent = ok ? 'Copied' : 'Copy failed';
  };
  renderPending();
  loadTime(id, fm, sec('Time'));
  // Show the first code reference on the card, so the pane isn't empty.
  const first = $('#content .q a.code[data-line]:not([data-line="0"])') || $('#content a.code[data-line]:not([data-line="0"])');
  if (first && docked()) preview(first, false); else if (!first) paneEmpty();
}

// The card's Time panel. Solo estimate and Harvest come from the card (the planner and /q sync write them);
// Claude's and your time are counted from the transcripts on every load (scripts/card-time.js).
// What to log is the owner's own time; the solo estimate is there to compare with, not to log. The Harvest row and
// the advice show only with harvest on in config.json.
async function loadTime(id, fm, section) {
  let t;
  await cfgLoad;
  try { t = await api('/api/time/' + encodeURIComponent(id)); }
  catch (e) { if (current === id && $('#timepanel')) $('#timepanel').innerHTML = `<span class="hint">${esc(e.message)}</span>`; return; }
  const el = $('#timepanel');
  if (current !== id || !el) return;
  if ($('#started')) $('#started').innerHTML = ICON.clock + esc(startedText(t.first, true));
  // Half-hour steps per day (card-time.js halfHours), with the measured minutes beside them.
  const h = (hours, ms) => `${hours.toFixed(1)} h <span class="hint">(${Math.round(ms / 60000)} min measured)</span>`;
  const has = v => v && v !== 'none';
  const logged = Number(fm.harvest_logged) || 0;
  const rows = [];
  rows.push(['Solo estimate', has(fm.solo_estimate) ? `${esc(fm.solo_estimate)} h <span class="hint">if you did it all yourself</span>` : '<span class="hint">none yet, the planner sets it</span>']);
  rows.push(['Claude', `${h(t.claudeH, t.claudeMs)} <span class="hint">working, ${t.sessions} session${t.sessions === 1 ? '' : 's'}${t.first ? `, ${t.first} to ${t.last}` : ''}</span>`]);
  rows.push(['You in sessions', `${h(t.youH, t.youMs)} <span class="hint">reading and answering, gaps over 10 min left out</span>`]);
  if (t.windowMs) rows.push(['No transcript', `${h(t.windowH, t.windowMs)} <span class="hint">app windows or cycle steps whose transcript is missing, not split</span>`]);
  if (cfg.harvest) rows.push(['Harvest', has(fm.harvest)
    ? `${logged.toFixed(1)} h on ${esc(fm.harvest)} <span class="hint">as of the last sync</span>`
    : '<span class="hint">nothing logged as of the last sync</span>']);
  const you = t.youH;
  const advice = !cfg.harvest ? '' : you > logged + 0.05
    ? `Log at least <b>${(you - logged).toFixed(1)} h</b> more: your session time is above what Harvest has. Add your own testing, review and reading outside sessions on top.`
    : 'Harvest covers your session time. Add your own testing, review and reading outside sessions.';
  let html = `<dl class="times">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` + (advice ? `<div class="timenote">${advice}</div>` : '');
  if (section && section.body && !section.body.startsWith("The planner's solo estimate by phase")) html += `<details class="timenote"><summary>Estimate by phase</summary>${md(section.body)}</details>`;
  el.innerHTML = html;
}

function wireForm() {
  const update = () => {
    let n = 0;
    for (const q of form.qs) {
      const a = form.answers[q.n], done = !!(a.choice || a.note.trim());
      if (done) n++;
      document.querySelector(`.q[data-n="${q.n}"]`).classList.toggle('done', done);
      document.querySelector(`.seg[data-n="${q.n}"]`).classList.toggle('on', done);
    }
    const any = n > 0 || form.note.trim();
    $('#submit').disabled = !any;
    $('#status').className = 'status';
    const k = pending.length, withShots = k ? ` ${k} screenshot${k === 1 ? ' goes' : 's go'} with it.` : '';
    $('#status').textContent = !form.qs.length ? (any ? `Draft saved.${withShots}` : 'Write instructions. Ctrl+Enter records.')
      : any ? `${n} of ${form.qs.length} answered, draft saved${n < form.qs.length ? '. The rest stay on the card.' : '.'}${withShots}` : 'Nothing picked yet. Ctrl+Enter records.';
    saveDraft();
  };
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const a = form.answers[b.dataset.n];
    a.choice = a.choice === b.dataset.k ? '' : b.dataset.k;
    document.querySelectorAll(`.opt[data-n="${b.dataset.n}"]`).forEach(x => x.classList.toggle('on', x.dataset.k === a.choice));
    update();
  }));
  document.querySelectorAll('textarea[data-n]').forEach(t => t.addEventListener('input', () => { form.answers[t.dataset.n].note = t.value; update(); }));
  $('#cardnote').addEventListener('input', e => { form.note = e.target.value; update(); });
  $('#submit').addEventListener('click', submit);
  form.update = update;
  // Hovering a question shows its first code reference in the pane.
  let timer = null;
  document.querySelectorAll('.q').forEach(qe => qe.addEventListener('mouseenter', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      document.querySelectorAll('.q.focus').forEach(x => x.classList.remove('focus'));
      qe.classList.add('focus');
      const a = qe.querySelector('a.code[data-line]:not([data-line="0"])');
      if (a && docked()) preview(a, false);
    }, 220);
  }));
}

// A draft of the open card's answers, saved in this browser on every pick and keystroke, so leaving the card (the FAQ,
// another card, a reload) keeps them. Nothing is committed and the card stays with you until Record decisions.
// Each answer carries its question's text and is dropped on restore if a cycle has rewritten that question since.
const draftKey = id => 'pq.draft.' + id;
function saveDraft() {
  const answers = {};
  for (const q of form.qs) {
    const a = form.answers[q.n];
    if (a.choice || a.note) answers[q.n] = { q: q.text, choice: a.choice, note: a.note };
  }
  if (Object.keys(answers).length || form.note) store.set(draftKey(form.id), JSON.stringify({ answers, note: form.note }));
  else store.del(draftKey(form.id));
}
function restoreDraft() {
  let d;
  try { d = JSON.parse(store.get(draftKey(form.id)) || 'null'); } catch { d = null; }
  if (!d) return;
  for (const q of form.qs) {
    const s = d.answers && d.answers[q.n];
    if (!s || s.q !== q.text) continue;
    const a = form.answers[q.n];
    a.choice = q.options.some(o => o.key === s.choice) ? s.choice : '';
    a.note = s.note || '';
    document.querySelectorAll(`.opt[data-n="${q.n}"]`).forEach(x => x.classList.toggle('on', x.dataset.k === a.choice));
    document.querySelector(`textarea[data-n="${q.n}"]`).value = a.note;
  }
  form.note = d.note || '';
  $('#cardnote').value = form.note;
  form.update();
}

async function submit() {
  if (!form || $('#submit').disabled) return;
  const id = form.id;
  const answers = Object.entries(form.answers).map(([n, a]) => ({ n: Number(n), choice: a.choice, note: a.note }));
  $('#submit').disabled = true;
  $('#status').className = 'status'; $('#status').textContent = 'Recording, committing, pushing…';
  setBusy(true);
  try {
    const r = await api(`/api/card/${encodeURIComponent(id)}/decision`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers, note: form.note, shots: pending.map(p => ({ token: p.token, caption: p.caption })) }),
    });
    store.del(draftKey(id));
    const k = pending.length;
    pending.forEach(p => URL.revokeObjectURL(p.url)); pending = [];
    await loadBoard();
    const shots = k ? ` with ${k} screenshot${k === 1 ? '' : 's'}` : '';
    const what = r.count ? `${r.count} decided` : 'note recorded';
    notice = r.queued ? { bad: false, msg: `${id}: ${what}${shots}, queued. ${r.job} is running; it is recorded and committed when that ends.` } : {
      bad: !!r.pushError,
      msg: `${id}: ${what}${shots}, committed` + (r.pushed ? ' and pushed. It waits for /q cycle.' : r.pushError ? `. Push failed: ${r.pushError}` : ', not pushed.'),
    };
    const target = board.you[0] ? board.you[0].Id : id;
    if (location.hash.slice(1) === target) openCard(target); else location.hash = target;
  } catch (e) {
    $('#status').className = 'status bad'; $('#status').textContent = e.message;
    $('#submit').disabled = false;
  } finally {
    setBusy(false);
  }
}

// The overlay stops clicks; inert also stops Tab and keyboard input reaching the page behind it. The page goes inert at
// once, so a second click can't land, but the overlay waits 250 ms so a save that returns at once doesn't flash it.
let busyTimer = 0;
function setBusy(on, msg, sub) {
  clearTimeout(busyTimer);
  if (on) {
    $('#busy .msg').textContent = msg || 'Recording decisions…';
    $('#busy .sub').textContent = sub || 'Committing and pushing the board';
    busyTimer = setTimeout(() => { $('#busy').hidden = false; }, 250);
  } else $('#busy').hidden = true;
  document.querySelectorAll('header, .app, #usagebar').forEach(el => { el.inert = on; });
}

// ---- screenshots ------------------------------------------------------------

// Ctrl+V on a card stages the image on the server right away. It is saved, committed and named in Decisions when
// you record your decisions, or with Save now. The cycle reads the files from the paths in Decisions.
function shotsSection(c) {
  const saved = (c.shots || []).map(n => {
    const u = `/api/attachment/${encodeURIComponent(c.fm.id)}/${encodeURIComponent(n)}`;
    return `<a class="shot" href="${u}" target="_blank" rel="noopener" title="${esc(n)}"><img src="${u}" alt="" loading="lazy"><span class="cap">${esc(n.replace(/\.png$/, ''))}</span></a>`;
  }).join('');
  return `<div class="sec">Screenshots</div><div class="panel"><div class="shots" id="shotlist">${saved}</div>
    <div class="shotbar"><span class="hint" id="shothint"></span><button class="btn" id="shotsave" hidden>Save now</button></div></div>`;
}

function renderPending() {
  const list = $('#shotlist');
  if (!list) return;
  list.querySelectorAll('.shot.new').forEach(e => e.remove());
  for (const p of pending) {
    const d = document.createElement('div');
    d.className = 'shot new';
    d.innerHTML = `<img src="${p.url}" alt=""><button class="x" title="Remove">×</button><input placeholder="Caption, optional" value="${esc(p.caption)}">`;
    d.querySelector('.x').addEventListener('click', () => { URL.revokeObjectURL(p.url); pending = pending.filter(x => x !== p); renderPending(); });
    d.querySelector('input').addEventListener('input', e => { p.caption = e.target.value; });
    list.appendChild(d);
  }
  const n = pending.length;
  $('#shothint').textContent = !n ? 'Ctrl+V pastes a screenshot here. The cycle and its agents read it.'
    : form ? `${n} not saved yet. They go with your decisions, or Save now commits them on their own.`
    : `${n} not saved yet.`;
  $('#shotsave').hidden = !n;
  $('#shotsave').onclick = saveShots;
  if (form && form.update) form.update();
}

// Clipboard images on Windows come as PNG; anything else is redrawn as PNG, the only type the server takes.
async function asPng(blob) {
  if (blob.type === 'image/png') return blob;
  const bmp = await createImageBitmap(blob);
  const cv = document.createElement('canvas');
  cv.width = bmp.width; cv.height = bmp.height;
  cv.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

document.addEventListener('paste', async e => {
  if (!current || current === 'faq' || !$('#shotlist')) return;
  const files = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile());
  if (!files.length) return;
  e.preventDefault();
  const id = current;
  for (const file of files) {
    try {
      const png = await asPng(file);
      const r = await api(`/api/card/${encodeURIComponent(id)}/shot`, { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: png });
      if (current !== id) return;
      pending.push({ token: r.token, url: URL.createObjectURL(png), caption: '' });
    } catch (err) { if (current === id) $('#shothint').textContent = 'Paste failed: ' + err.message; return; }
  }
  renderPending();
});

async function saveShots() {
  const id = current, n = pending.length;
  if (!n) return;
  setBusy(true, 'Saving screenshots…');
  try {
    const r = await post(`/api/card/${encodeURIComponent(id)}/edit`, { action: 'shots', shots: pending.map(p => ({ token: p.token, caption: p.caption })) });
    pending.forEach(p => URL.revokeObjectURL(p.url)); pending = [];
    await loadBoard();
    notice = r.queued ? { bad: false, msg: `${id}: ${n} screenshot${n === 1 ? '' : 's'} queued. ${r.job} is running; they are saved and committed when that ends.` }
      : { bad: !!r.pushError, msg: `${id}: ${n} screenshot${n === 1 ? '' : 's'} saved` + (r.pushError ? `. Push failed: ${r.pushError}` : r.pushed ? ', committed and pushed.' : ', committed.') };
  } catch (err) { notice = { bad: true, msg: err.message }; }
  finally { setBusy(false); }
  // A failed save keeps the pasted images, so they can be saved again; openCard keeps them for the same card.
  openCard(id);
}

// ---- test list --------------------------------------------------------------

// The card's `## Test list`, written by the cycle when the final review approves: "- [ ] text" lines, with any other
// lines (headings, setup) shown between them. Ticks are a draft in this browser, like the decision picks, until Save
// writes them to the card in one commit. A draft tick is kept only while its line's place and text are unchanged.
let tests = null; // { id, list: [{ i, text, done }], draft: { i: done } }
const testsKey = id => 'pq.tests.' + id;
function testListSection(id, body) {
  const list = [];
  let html = '', prose = [];
  const flush = () => { if (prose.length) html += `<div class="md tlprose">${md(prose.join('\n'))}</div>`; prose = []; };
  for (const line of body.split('\n')) {
    const m = /^- \[( |x|X)\] (.*)$/.exec(line);
    if (!m) { if (line.trim()) prose.push(line); continue; }
    flush();
    const t = { i: list.length, text: m[2].trim(), done: m[1] !== ' ' };
    list.push(t);
    html += `<div class="tcheck" data-i="${t.i}"><input type="checkbox"${t.done ? ' checked' : ''}><span class="md">${inline(t.text)}</span></div>`;
  }
  flush();
  if (!list.length) return `<div class="sec">Test list</div><div class="panel">${md(body)}</div>`;
  let saved = {};
  try { saved = JSON.parse(store.get(testsKey(id)) || '{}'); } catch { saved = {}; }
  const draft = {};
  for (const [i, d] of Object.entries(saved)) if (list[i] && list[i].text === d.text && list[i].done !== d.done) draft[i] = d.done;
  tests = { id, list, draft };
  return `<div class="sec">Test list<span class="secnum" id="tlcount"></span></div><div class="panel"><div class="tlist">${html}</div>
    <div class="shotbar tlbar"><span class="hint" id="tlhint"></span><button class="btn" id="tlsave" disabled>Save ticks</button></div></div>`;
}

function wireTests() {
  const update = () => {
    const keep = {};
    for (const [i, done] of Object.entries(tests.draft)) keep[i] = { text: tests.list[i].text, done };
    if (Object.keys(keep).length) store.set(testsKey(tests.id), JSON.stringify(keep)); else store.del(testsKey(tests.id));
    const isDone = t => (t.i in tests.draft ? tests.draft[t.i] : t.done);
    const n = Object.keys(tests.draft).length;
    document.querySelectorAll('.tcheck').forEach(el => {
      const t = tests.list[el.dataset.i];
      el.querySelector('input').checked = isDone(t);
      el.classList.toggle('done', isDone(t));
      el.classList.toggle('changed', t.i in tests.draft);
    });
    $('#tlcount').textContent = `${tests.list.filter(isDone).length} of ${tests.list.length} done`;
    $('#tlhint').textContent = n ? `${n} tick${n === 1 ? '' : 's'} not saved, draft kept in this browser.` : 'Tick what you have tested, then Save ticks.';
    $('#tlsave').disabled = !n;
  };
  // A click anywhere on the row ticks it, except on a link in the text, which opens as usual (as on the option buttons).
  document.querySelectorAll('.tcheck').forEach(row => row.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    if (e.target.tagName !== 'INPUT') e.preventDefault();
    const t = tests.list[row.dataset.i];
    const now = !(t.i in tests.draft ? tests.draft[t.i] : t.done);
    if (now === t.done) delete tests.draft[t.i]; else tests.draft[t.i] = now;
    update();
  }));
  $('#tlsave').addEventListener('click', saveTests);
  update();
}

async function saveTests() {
  const { id, list, draft } = tests;
  const checks = Object.entries(draft).map(([i, done]) => ({ i: Number(i), text: list[i].text, done }));
  if (!checks.length) return;
  setBusy(true, 'Saving ticks…');
  try {
    const r = await post(`/api/card/${encodeURIComponent(id)}/edit`, { action: 'checks', checks });
    store.del(testsKey(id));
    await loadBoard();
    const what = `${checks.length} tick${checks.length === 1 ? '' : 's'} saved on the test list`;
    notice = r.queued ? { bad: false, msg: `${id}: ${what}, queued. ${r.job} is running; it is recorded and committed when that ends.` }
      : { bad: !!r.pushError, msg: `${id}: ${what}` + (r.pushError ? `. Push failed: ${r.pushError}` : r.pushed ? ', committed and pushed.' : ', committed.') };
  } catch (err) { notice = { bad: true, msg: err.message }; }
  finally { setBusy(false); }
  openCard(id);
}

// ---- preview pane -----------------------------------------------------------

let shown = null;
function paneEmpty() {
  shown = null;
  $('#pane').innerHTML = `<div class="pempty">${ART.lamp}<div>Hover a question or click a code link to see the code here.</div><div style="font-size:12px;margin-top:6px">Ctrl+click a link opens it in VS Code.</div></div>`;
  $('#pane').style.display = 'flex';
}

async function preview(a, open = true, before, after) {
  const req = { path: a.dataset.path, line: Number(a.dataset.line) || 0, vscode: a.getAttribute('href') };
  document.querySelectorAll('a.code.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll(`a.code[data-path="${CSS.escape(req.path)}"][data-line="${req.line}"]`).forEach(x => x.classList.add('on'));
  await showSnippet(req, before, after);
  if (open && !docked()) $('#pane').classList.add('open');
}

async function showSnippet(req, before, after) {
  const key = `${req.path}#${req.line}#${before}#${after}`;
  if (shown === key) return;
  shown = key;
  const qs = new URLSearchParams({ path: req.path, line: req.line });
  if (before) qs.set('before', before); if (after) qs.set('after', after);
  let s;
  try { s = await api('/api/snippet?' + qs); }
  catch (e) {
    if (shown !== key) return;
    $('#pane').innerHTML = paneHead(req.path.split('/').pop(), esc(e.message), req.vscode) + '<div class="pbody"></div>';
    wirePane(req);
    return;
  }
  if (shown !== key) return;
  let ctx = esc(s.file);
  if (s.ext === 'al') ctx = [s.object ? esc(s.object) : '', s.proc ? `${esc(s.proc.kind)} <b>${esc(s.proc.name)}</b>` : '', s.line ? `line ${s.line}` : ''].filter(Boolean).join(' · ');
  let body;
  if (s.ext === 'md') {
    body = `<div class="pbody mdv">${md(s.lines.join('\n'))}</div>`;
  } else {
    const rows = s.lines.map((t, i) => {
      const n = s.start + i;
      const cls = [n === s.line ? 'hit' : '', s.proc && n === s.proc.line ? 'procl' : ''].filter(Boolean).join(' ');
      return `<tr${cls ? ` class="${cls}"` : ''}><td class="ln">${n}</td><td class="src">${s.ext === 'al' ? hl(t) : esc(t)}</td></tr>`;
    }).join('');
    const b = s.line - s.start, f = s.end - s.line;
    const lo = s.proc ? s.proc.start : 1, hi = s.proc ? s.proc.end : s.total;
    body = `<div class="pbody">${s.start > lo ? `<button class="more" data-before="${b + 40}" data-after="${f}">Show 40 more above</button>` : ''}
      <table class="code">${rows}</table>
      ${s.end < hi ? `<button class="more" data-before="${b}" data-after="${f + 60}">Show 60 more below</button>` : ''}</div>`;
  }
  $('#pane').innerHTML = paneHead(s.name, ctx, req.vscode) + body;
  wirePane(req);
  const hit = $('#pane tr.hit');
  if (hit && !before) hit.scrollIntoView({ block: 'center' });
}

function paneHead(name, ctx, vscode) {
  return `<div class="phead"><div class="where"><div class="fname">${esc(name)}</div><div class="ctx">${ctx}</div></div>
    <div class="pacts"><a class="btn" href="${esc(vscode)}" title="Open in VS Code">${ICON.ext}VS Code</a>
    ${docked() ? '' : `<button class="btn ghost" id="pclose" title="Close">${ICON.close}</button>`}</div></div>`;
}
function wirePane(req) {
  const c = $('#pclose'); if (c) c.addEventListener('click', () => $('#pane').classList.remove('open'));
  document.querySelectorAll('#pane .more').forEach(b => b.addEventListener('click', async () => {
    const sc = $('#pane .pbody').scrollTop, h = $('#pane .pbody').scrollHeight;
    await showSnippet(req, Number(b.dataset.before), Number(b.dataset.after));
    const pb = $('#pane .pbody');
    if (b.dataset.before > 0 && pb.scrollHeight > h) pb.scrollTop = sc + (pb.scrollHeight - h);
  }));
}

// Code links preview on click; Ctrl/Cmd+click goes to VS Code as a normal link.

// ---- jobs: pull, add, sync, cycle, step, open -------------------------------

let ado = null, polling = null;
const leafName = p => String(p || '').split('\\').pop();
const year = p => String(p).split('\\')[2];
const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

async function loadAdo() {
  ado = await api('/api/ado');
  const today = new Date().toISOString().slice(0, 10);
  const years = [...new Set(ado.iterations.map(i => year(i.path)))];
  $('#iter').innerHTML = years.map(y => `<optgroup label="${esc(y)}">` + ado.iterations.filter(i => year(i.path) === y).map(i => {
    const now = i.start <= today && today <= i.end ? ' · by date now' : '';
    return `<option value="${esc(i.path)}"${i.path === ado.iteration ? ' selected' : ''}>${esc(leafName(i.path) + now)}</option>`;
  }).join('') + '</optgroup>').join('');
  showJob();
}

// While a job runs, every control that starts a job or writes a card is off, and the header says what runs.
function showJob() {
  if (!ado) return;
  const j = ado.job, run = !!j.running;
  document.querySelectorAll('.jobctl, .cardacts .btn[data-act], #drawer [data-save]').forEach(b => { b.disabled = run; });
  $('#job').hidden = !run;
  document.querySelector('header').classList.toggle('running', run);
  if (run) {
    const s = Math.max(0, Math.round((Date.now() - Date.parse(j.started)) / 1000));
    const time = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    $('#job').innerHTML = `<span class="dot"></span>${esc(j.label)} · ${j.terminal ? 'window open ' : ''}${time}`;
  }
  const lp = ado.lastPull, ls = ado.lastSync;
  $('#pull').title = lp ? `Last pull ${lp.at}, ${leafName(lp.iteration)}: ${lp.added.length ? 'added ' + lp.added.join(', ') : 'nothing new'}` : 'No pull yet';
  $('#sync').title = 'Refresh ADO state and PR on every open card (runs Claude Code)' + (ls ? `. Last sync ${ls.at}` : '');
}

// While a job runs, ask every 3 s. When it ends, reload the board and show what it did.
async function poll() {
  clearTimeout(polling);
  try { ado = await api('/api/ado'); } catch { polling = setTimeout(poll, 3000); return; }
  if (ado.job.running) { showJob(); polling = setTimeout(poll, 3000); return; }
  const j = ado.job;
  await loadAdo(); await loadBoard(); loadUsage();
  notice = { bad: !j.ok, msg: j.message || `${j.label} finished.`, log: j.ok ? '' : j.log };
  const go = j.kind === 'add' && j.ok ? j.id : current;
  if (go && go !== current) location.hash = go; else openCard(current);
}

// The dialog body for /api/estimate: the likely total, the 5-hour window and the week as bars (used now, this run's
// median and range, the gate's line), and a note when no card is ready. The readings are
// the server's (e.left, e.weekLeft), so the bars match what the gate will see.
function estimateHtml(e) {
  const k = n => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.round(n / 1e3) + 'k');
  const c = x => Math.max(0, Math.min(100, x));
  // One limit: used now, this run's range and median from there, and the line the gate asks at.
  const meter = (f, p, cap, over) => `<div class="emeter${over ? ' over' : ''}"><span class="used" style="width:${c(f)}%"></span>` +
    (p ? `<span class="range" style="left:${c(f)}%;width:${c(f + p[2]) - c(f)}%"></span><span class="run" style="left:${c(f)}%;width:${c(f + p[1]) - c(f)}%"></span>` : '') +
    `<span class="cap" style="left:${cap}%" title="The cycle asks before passing ${cap}%"></span></div>`;
  const known = !!(e.pct && e.tokens[1]), cap = e.pct ? 95 : 85;
  let h = '<div class="est">';
  h += e.tokens[1] ? `<div class="etok"><b>~${k(e.tokens[1])}</b> tokens, likely ${k(e.tokens[0])}–${k(e.tokens[2])}</div>`
    : '<div class="etok">No past runs to estimate from.</div>';
  if (e.left !== null) {
    const f = 100 - e.left;
    const over = known && f + e.pct[1] > cap;
    h += meter(f, known ? e.pct : null, cap, over);
    h += `<div class="elegend">5-hour window at <b>${f}%</b>` +
      (known ? `, this run about <b>${e.pct[1]}%</b> (${e.pct[0]}–${e.pct[2]}%)${over ? ', more than is left under the line' : ''}` : ', this run\'s share not known until a cycle has been measured') +
      `.</div>`;
  } else h += `<div class="elegend">No limit reading yet.</div>`;
  // The week, once a past cycle has measured it. The gate asks once it is at 95%.
  if (e.weekLeft !== null && e.weekPct && e.tokens[1]) {
    const f = 100 - e.weekLeft, over = f + e.weekPct[1] >= 95;
    h += meter(f, e.weekPct, 95, over);
    h += `<div class="elegend">Week at <b>${f}%</b>, this run about <b>${e.weekPct[1]}%</b> (${e.weekPct[0]}–${e.weekPct[2]}%)${over ? ', which reaches the line' : ''}.</div>`;
  }
  if (!e.steps.length) h += '<div class="enote">No card is decided or with the agent.</div>';
  return h + '</div>';
}

// The app's own confirm, a <dialog> in the board's theme. ask is confirm-style text: the first paragraph is the
// title, the rest the body. extra is HTML put under it. Resolves true on the primary button; Cancel, Esc and a click
// on the backdrop resolve false.
function askDialog(ask, extra = '', ok = 'OK') {
  const d = $('#ask'), [title, ...rest] = ask.split('\n\n');
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${rest.map(p => `<p>${esc(p)}</p>`).join('')}${extra}
    <div class="dacts"><button class="btn ghost" value="no">Cancel</button><button class="btn primary" value="yes" autofocus>${esc(ok)}</button></div></form>`;
  d.returnValue = '';
  d.onclick = ev => { if (ev.target === d) d.close(); };
  d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'yes'), { once: true }));
}

let reading = false; // a probe before a cycle or step dialog; a second click meanwhile would open a second dialog
async function startJob(kind, body, ask) {
  const measured = kind === 'cycle' || kind === 'step';
  // Cycle and Run next step read the limits first, so the dialog's bar and warning are live, not up to 30 min old.
  if (measured) {
    if (reading) return false;
    reading = true;
    try { await refreshUsage(); } finally { reading = false; }
  }
  // Above 80% of the 5-hour window or 90% of the week, every Claude job asks first.
  const warn = usageWarning();
  // Cycle and Run next step always ask, with what they will likely use.
  let est = '';
  if (measured) {
    try { est = estimateHtml(await api(`/api/estimate?kind=${kind}` + (body && body.id ? '&id=' + encodeURIComponent(body.id) : ''))); }
    catch (err) { est = `<div class="enote">No estimate: ${esc(err.message)}</div>`; }
  }
  const title = kind === 'cycle' ? 'Start a cycle?' : kind === 'step' ? `Run the next step on ${body.id}?` : `Start ${kind}${body && body.id ? ' ' + body.id : ''}?`;
  if ((ask || warn || est) && !(await askDialog(ask || title, est + warn, 'Start'))) return false;
  try {
    const r = await post('/api/job/' + kind, body);
    ado.job = { running: true, kind, label: r.label, terminal: ['cycle', 'step', 'open'].includes(kind), started: new Date().toISOString() };
    showJob();
    polling = setTimeout(poll, 3000);
    return true;
  } catch (err) { notice = { bad: true, msg: err.message }; openCard(current); return false; }
}

$('#iter').addEventListener('change', async e => {
  const path = e.target.value;
  setBusy(true, `Setting the iteration to ${leafName(path)}…`);
  try {
    const r = await post('/api/iteration', { path });
    ado.iteration = path;
    notice = { bad: !!r.pushError, msg: `Iteration set to ${leafName(path)}` + (r.pushError ? `. Push failed: ${r.pushError}` : '.') };
  } catch (err) { notice = { bad: true, msg: err.message }; await loadAdo(); }
  finally { setBusy(false); }
  openCard(current);
});
$('#pull').addEventListener('click', () => startJob('pull', {},
  `Pull ${leafName(ado.iteration)}?\n\nClaude Code reads ADO and writes a card for each of your Development items there that has none. It takes a minute or more.`));
$('#addform').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#addid').value.trim();
  if (!/^\d+$/.test(id)) { $('#addid').focus(); return; }
  if (await startJob('add', { id })) $('#addid').value = '';
});
$('#sync').addEventListener('click', () => startJob('sync', {},
  'Sync every open card?\n\nClaude Code reads ADO state and PRs and updates the cards. A closed work item with a merged PR goes to done.'));

// ---- usage bar ----------------------------------------------------------------

// The 5-hour and weekly limits, from the last Claude run the server saw. A probe runs when the numbers are older
// than 30 minutes, checked every minute while the app is open, and on the refresh button.
let usage = null;
const USAGE_EVERY = 30 * 60 * 1000;
const fresh = () => usage && Date.now() - usage.at < USAGE_EVERY;
function when(ms) {
  const d = new Date(ms), now = new Date();
  const t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + t;
}
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
}

function renderUsage(busy) {
  $('#usagerefresh').classList.toggle('spin', !!busy);
  if (!usage) { $('#usage').textContent = busy ? 'Reading the limits…' : 'No numbers yet. Refresh reads them.'; return; }
  const win = (name, w, warnAt, badAt) => {
    if (!w) return `<span class="uwin">${name} <span class="uage">no data</span></span>`;
    const cls = w.pct >= badAt ? ' bad' : w.pct >= warnAt ? ' warn' : '';
    return `<span class="uwin${cls}" title="Resets ${esc(new Date(w.resetsAt).toLocaleString('en-GB'))}">${name}
      <span class="umeter"><span style="width:${Math.min(100, w.pct)}%"></span></span><b>${w.pct}%</b> resets ${esc(when(w.resetsAt))}</span>`;
  };
  $('#usage').innerHTML = win('5-hour', usage.five_hour, 60, 80) + win('Week', usage.seven_day, 75, 90) +
    `<span class="uage">${esc(ago(usage.at))}, from ${usage.source === 'probe' ? 'a probe' : 'a job'}</span>`;
}

async function loadUsage() {
  try { const r = await api('/api/usage'); usage = r.usage; renderUsage(r.probing); } catch { return; }
  if (!fresh()) refreshUsage();
}
async function refreshUsage() {
  renderUsage(true);
  try { usage = (await post('/api/usage/refresh')).usage; } catch { /* keep the old numbers */ }
  renderUsage(false);
}
function usageWarning() {
  if (!usage) return '';
  const hi = [];
  const f = usage.five_hour, w = usage.seven_day;
  if (f && f.pct >= 80) hi.push(`the 5-hour window is at ${f.pct}%, resets ${when(f.resetsAt)}`);
  if (w && w.pct >= 90) hi.push(`the week is at ${w.pct}%, resets ${when(w.resetsAt)}`);
  return hi.length ? `<div class="dwarn">Usage is high: ${esc(hi.join('; '))}.</div>` : '';
}
$('#usagerefresh').addEventListener('click', refreshUsage);
setInterval(() => { if (fresh()) renderUsage(false); else refreshUsage(); }, 60 * 1000);

// ---- card actions -------------------------------------------------------------

// Toolbar under the card's info. Claude and VS Code are labelled groups of equal weight; the status buttons
// carry the colour of the state they move the card to, on the icon only.
// reopen: { ok, why } from the server on decided and agent cards, which get Re-open instead of Back to you.
function cardActions(fm, reopen) {
  const b = (act, label, title, cls = '') => `<button class="btn${cls}" data-act="${act}" title="${esc(title)}">${label}</button>`;
  const grp = (cls, icon, name, inner) => `<span class="grp ${cls}"><span class="lbl">${icon}${name}</span>${inner}</span>`;
  const s = fm.state;
  let claude = '';
  if (s === 'agent') claude += b('step', 'Run next step', `Open Claude Code in a terminal window with /q cycle ${fm.id}`);
  if (s === 'decided') claude += b('step', 'Settle and run', `Open Claude Code in a terminal window with /q cycle ${fm.id}: it settles your decisions, then runs the step if the card goes to the agent`);
  claude += b('open', 'Open card', `Open Claude Code in a terminal window with /q ${fm.id}`);
  // Open workspace has no data-act: the document-level .vsc handler opens it, and a running job doesn't block it.
  let vsc = fm.repo !== 'none' ? `<button class="btn vsc" data-repo="${esc(fm.repo)}" title="Open the ${esc(fm.repo)} workspace in VS Code">Open workspace</button>` : '';
  vsc += b('handoff', 'Handoff', 'Copy a prompt that points the agent at this card, open the repo copy\'s workspace in VS Code (starts it if needed) and prefill the prompt in Claude Code there');
  let h = '<div class="cardacts">' + grp('cl', ICON.term, 'Claude', claude) + grp('vs', ICON.code, 'VS Code', vsc) + '<span class="sep"></span>';
  if (reopen) h += reopen.ok ? b('reopen', `${ICON.user}Re-open`, 'Take back your last decision from the app: its questions come back as they were', ' to-you')
    : `<button class="btn to-you" disabled title="${esc("Can't re-open: " + reopen.why)}">${ICON.user}Re-open</button>`;
  else if (s !== 'you') h += b('you', `${ICON.user}Back to you`, 'Move the card to waiting on you', ' to-you');
  if (s !== 'review' && s !== 'done') h += b('review', `${ICON.branch}In review…`, 'Done on your side, waiting on code review. Back to you or Done takes it out', ' to-review');
  if (s !== 'parked' && s !== 'done') h += b('park', `${ICON.pause}Park…`, 'Park it until a date', ' to-park');
  if (s !== 'done') h += b('done', `${ICON.ok}Done`, 'Mark the card done; it leaves the board', ' to-done');
  h += b('edit', `${ICON.edit}Edit…`, 'Title, priority, production, repo copy, branch, next step, revisit', ' ghost end');
  return h + '</div><div id="drawer"></div>';
}

function wireActions(fm) {
  document.querySelectorAll('.cardacts .btn[data-act]').forEach(btn => btn.addEventListener('click', () => {
    const act = btn.dataset.act;
    if (act === 'step' || act === 'open') startJob(act, { id: fm.id });
    else if (act === 'handoff') handoff(fm.id);
    else if (act === 'done') saveCard(fm.id, { action: 'done' }, 'done', `Mark ${fm.id} done? It leaves the board.`);
    else if (act === 'you') saveCard(fm.id, { action: 'you' }, 'back to you');
    else if (act === 'reopen') saveCard(fm.id, { action: 'reopen' }, 're-opened', `Re-open ${fm.id}?\n\nYour last decision from the app comes off the card and its questions go back under Waiting on you, as they were.` +
      (fm.state === 'agent' ? ' What the cycle made of it goes too, and the next step.' : ''), 'Re-open');
    else drawer(fm, act);
  }));
  showJob();
}

// The clipboard copy is the fallback for when the prefill URI lands in another VS Code window or before the
// extension is up. A cold start gets a few seconds before the URI goes out.
async function handoff(id) {
  // Held around the whole handoff: a cold VS Code start waits 8 s after the POST has returned.
  setBusy(true, `Handing off ${id}…`, 'Opening VS Code and Claude Code');
  try {
    const r = await post(`/api/card/${encodeURIComponent(id)}/handoff`);
    let copied = true;
    try { await navigator.clipboard.writeText(r.prompt); } catch { copied = false; }
    if (!r.wasRunning) await new Promise(ok => setTimeout(ok, 8000));
    const a = document.createElement('a');
    a.href = r.uri; a.click();
    notice = { bad: !copied, msg: `${id}: ` + (r.workspace ? 'workspace opened in VS Code' : 'no repo copy on the card, so no workspace opened') +
      ', prompt sent to Claude Code' + (copied ? ' and copied.' : '. Copy to clipboard failed.') };
  } catch (err) { notice = { bad: true, msg: 'Handoff: ' + err.message }; }
  finally { setBusy(false); }
  openCard(current);
}

const SAVING = { park: 'Parking', done: 'Marking done', you: 'Sending back to you', reopen: 'Re-opening', review: 'Moving to review' };
async function saveCard(id, body, what, ask, ok) {
  if (ask && !(await askDialog(ask, '', ok))) return;
  setBusy(true, `${SAVING[body.action] || 'Saving'} ${id}…`);
  try {
    const r = await post(`/api/card/${encodeURIComponent(id)}/edit`, body);
    await loadBoard();
    notice = r.queued ? { bad: false, msg: `${id}: ${what}, queued. ${r.job} is running; it is recorded and committed when that ends.` }
      : { bad: !!r.pushError, msg: `${id}: ${what}` + (r.pushError ? `. Push failed: ${r.pushError}` : r.pushed ? ', committed and pushed.' : ', committed.') };
  } catch (err) { notice = { bad: true, msg: err.message }; }
  finally { setBusy(false); }
  openCard(current);
}

// Park and Edit open a small form under the buttons. Clicking the same button again closes it.
function drawer(fm, kind) {
  const d = $('#drawer');
  if (d.dataset.kind === kind) { d.innerHTML = ''; d.className = ''; d.dataset.kind = ''; return; }
  d.dataset.kind = kind; d.className = 'drawer';
  const val = n => (fm[n] === undefined ? '' : String(fm[n]));
  const sel = (n, opts) => `<select name="${n}">${opts.map(([v, t]) => `<option value="${esc(v)}"${val(n) === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  const inp = n => `<input name="${n}" value="${esc(val(n))}">`;
  const date = (n, v) => `<input name="${n}" type="date" value="${esc(v)}">`;
  let h;
  if (kind === 'park') {
    h = `<label>Revisit</label>${date('revisit', new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10))}
      <label>Note</label><input name="note" placeholder="Optional: why, or who it waits on">`;
  } else if (kind === 'review') {
    h = `<label>PR</label><input name="pr" inputmode="numeric" value="${esc(/^\d+$/.test(val('pr')) ? val('pr') : '')}">
      <label>Reviewer</label><input name="reviewer" value="${esc(val('reviewer') === 'none' ? '' : val('reviewer'))}" placeholder="Optional: who reviews it">`;
  } else {
    const repos = ['none', ...board.copies.map(c => c.Name)];
    if (!repos.includes(val('repo'))) repos.push(val('repo'));
    h = `<label>Title</label>${inp('title')}
      <label>Priority</label>${sel('ado_prio', [['4', '4 Urgent'], ['3', '3 High'], ['2', '2 Medium'], ['1', '1 Low']])}
      <label>Production</label>${sel('prod', [['yes', 'yes'], ['no', 'no']])}
      <label>Unblocks agent</label>${sel('blocks_agent', [['yes', 'yes'], ['no', 'no']])}
      <label>Repo copy</label>${sel('repo', repos.map(r => [r, r]))}
      <label>Branch</label>${inp('branch')}
      <label>Next step</label>${inp('next_step')}
      <label>Revisit</label>${date('revisit', val('revisit') === 'none' ? '' : val('revisit'))}
      <label>Note</label><input name="note" placeholder="Optional, goes in Decisions">`;
  }
  d.innerHTML = h + `<div class="row"><span class="status"></span><button class="btn ghost" data-x>Cancel</button>
    <button class="btn primary" data-save>${kind === 'park' ? 'Park' : kind === 'review' ? 'In review' : 'Save'}</button></div>`;
  const v = n => d.querySelector(`[name="${n}"]`).value.trim();
  const say = t => { d.querySelector('.status').textContent = t; };
  d.querySelector('[data-x]').addEventListener('click', () => drawer(fm, kind));
  d.querySelector('[data-save]').addEventListener('click', () => {
    if (kind === 'review') {
      if (!/^\d+$/.test(v('pr'))) return say('PR number, digits only.');
      return saveCard(fm.id, { action: 'review', pr: v('pr'), reviewer: v('reviewer') }, `in review, PR ${v('pr')}`);
    }
    if (kind === 'park') {
      if (!v('revisit')) return say('Pick a date.');
      return saveCard(fm.id, { action: 'park', revisit: v('revisit'), note: v('note') }, `parked until ${v('revisit')}`);
    }
    const fields = {};
    for (const n of ['title', 'ado_prio', 'prod', 'blocks_agent', 'repo', 'branch', 'next_step', 'revisit']) {
      const x = v(n) || 'none';
      if (x !== val(n)) fields[n] = x;
    }
    if (!Object.keys(fields).length) return say('Nothing changed.');
    saveCard(fm.id, { action: 'fields', fields, note: v('note') }, 'saved ' + Object.keys(fields).join(', '));
  });
  showJob();
  d.querySelector('input, select').focus();
}

(async () => {
  paneEmpty();
  try { await loadBoard(); } catch (e) { $('#stats').innerHTML = `<span class="stat">${esc(e.message)}</span>`; return; }
  loadUsage();
  try { await loadAdo(); if (ado.job.running) poll(); } catch (e) { $("#iter").innerHTML = `<option>${esc(e.message)}</option>`; document.querySelectorAll(".jobctl").forEach(x => { x.disabled = true; }); }
  const id = decodeURIComponent(location.hash.slice(1)) || (board.you[0] && board.you[0].Id);
  if (id && location.hash.slice(1) !== id) location.hash = id; else openCard(id);
})();
</script>
